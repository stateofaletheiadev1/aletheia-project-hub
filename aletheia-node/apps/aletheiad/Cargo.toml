[package]
name = "aletheiad"
description = "The Aletheia StableChain node daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aletheia-core.workspace = true
aletheia-crypto.workspace = true
aletheia-execution.workspace = true
aletheia-executor.workspace = true
aletheia-node.workspace = true
aletheia-p2p.workspace = true
aletheia-rpc.workspace = true
aletheia-storage.workspace = true
serde.workspace = true
toml.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }

[features]
default = ["rocksdb"]
# Production storage. Without it the daemon keeps state in memory (NON-PRODUCTION; tests and
# quick local runs only) and says so at start-up.
rocksdb = ["aletheia-storage/rocksdb"]
devnet-producer = ["aletheia-node/devnet-producer"]

[lints]
workspace = true
