[package]
name = "aletheia-arno-exec"
description = "Contract executor worker: runs Arno calls for the node over the executor protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aletheia-vm.workspace = true

[target.'cfg(unix)'.dependencies]
# Caps the worker's address space at start-up (a safe wrapper over setrlimit; unsafe code is
# forbidden in this workspace).
rlimit = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# The worker's kernel sandbox (src/sandbox.rs): no filesystem (Landlock), no processes,
# sockets or debugging (seccomp). Both crates wrap the system calls safely.
landlock = "0.4"
libc = "0.2"
seccompiler = "0.4"

[dev-dependencies]
aletheia-arno.workspace = true
aletheia-core.workspace = true
aletheia-execution.workspace = true
aletheia-executor.workspace = true

[lints]
workspace = true
