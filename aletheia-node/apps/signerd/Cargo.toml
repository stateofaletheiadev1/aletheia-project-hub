[package]
name = "aletheia-signerd"
description = "The aletheia-signer daemon: holds a validator's consensus key and signs only what cannot equivocate (spec 19.2, ADR-063)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "aletheia-signer"
path = "src/main.rs"

[dependencies]
aletheia-core.workspace = true
aletheia-crypto.workspace = true
aletheia-signer.workspace = true
aletheia-wallet.workspace = true
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
getrandom.workspace = true

[lints]
workspace = true
