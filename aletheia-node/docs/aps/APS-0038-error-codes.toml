# APS-0038 appendix: protocol error codes.
#
# This file is the single source for error codes. `crates/core/src/error_codes.rs` must match
# it exactly; the test `error_codes_match_registry` in that crate fails on any difference.
#
# Rules (spec Section 57):
#   - codes are u32, grouped by thousands per subsystem;
#   - a code is never reused; a retired code stays listed with `retired = true`;
#   - `name` is the stable symbolic name used in RPC errors;
#   - `class` is "reject" (the input is refused, the node continues) or "fail-stop"
#     (the node must stop rather than continue, spec Section 46.3).
#
# Ranges:
#   1000-1099 canonical decoding (APS-0041)
#   1100-1199 text encoding of binary values (APS-0048)
#   1200-1299 addresses and identifiers (APS-0002)
#   1300-1399 network identity (APS-0001)
#   2000-2999 transactions (APS-0003)
#   4000-4999 cryptography (APS-0037, APS-0009)
#   5000-5999 state (APS-0005)
#   6000-6999 payments (APS-0049..0053)
#   9000-9999 arithmetic and monetary (APS-0020)
#   11000-11999 finalization
#   12000-12999 protocol versions and continuity (APS-0054)

[[code]]
code = 1001
name = "DECODE_NON_CANONICAL"
variant = "DecodeNonCanonical"
class = "reject"
message = "Input is not the canonical ACE encoding of the expected type."

[[code]]
