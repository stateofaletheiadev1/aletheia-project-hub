# Kernel settings for an aletheiad host (docs/operations/vps.md). Install to
# /etc/sysctl.d/99-aletheia.conf, then: sysctl --system
#
# With swap: prefer dropping file cache over swapping the node's memory out. The node still
# runs if it is swapped (every limit leaves wide margins), but consensus rounds are timed.
vm.swappiness = 10
# Keep reclaiming file cache rather than inodes and dentries RocksDB walks constantly.
vm.vfs_cache_pressure = 50
# Write dirty pages back steadily instead of in large bursts that stall fsync.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
# Enough file handles for RocksDB.
fs.file-max = 262144
