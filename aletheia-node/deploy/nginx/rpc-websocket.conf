# Inside the existing `server { server_name rpc.stateofaletheia.org; ... }` block (ADR-064).
# Forwards the WebSocket upgrade for /ws/v1 to the node's RPC listener and keeps idle sockets
# open past nginx's default 60 s (the node pings every 15 s).
location /ws/v1 {
    proxy_pass http://127.0.0.1:7781;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
