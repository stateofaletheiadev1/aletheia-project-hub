# Drop-in for a validator whose consensus key lives in aletheia-signer (ADR-063).
# Install to /etc/systemd/system/aletheiad.service.d/validator.conf, then: systemctl daemon-reload
[Unit]
# Wants, not Requires: when the signer restarts the node keeps running and reconnects; it
# misses at most the votes of those seconds.
Wants=aletheia-signer.service
After=aletheia-signer.service

[Service]
# Reach /run/aletheia-signer/signer.sock (directory 0750, socket 0660, group aletheia-signer).
SupplementaryGroups=aletheia-signer
# The node keystore password (node_key_password_file in node.toml points here).
LoadCredential=node-key-password:/etc/aletheia/node-key-password
