# SEPA Instant Credit Transfer
#
# DRAFT: written from the scheme operator's public material as understood when drafted. It is
# not active until two reviewers have checked every value against the operator's current
# publications and the partner's implementation guide (spec Section 40C.3) and recorded it in
# docs/apn/profile-verification/. Values left empty are set at that verification.

rail                = "sepa-sct-inst"
operator            = "European Payments Council (scheme) / CSM per partner"
rulebook            = "SCT Inst Rulebook, version in force on effective_from"
status              = "draft"
effective_from      = "2025-10-05"
effective_until     = ""
source_documents    = [
  "EPC SCT Inst Rulebook (version in force on effective_from)",
  "EPC SCT Inst Interbank Implementation Guidelines",
  "Regulation (EU) 2024/886 (Instant Payments Regulation)",
]
reviewed_by         = []
reviewed_on         = ""

[messages]
credit_transfer     = "pacs.008.001.08"
status_report       = "pacs.002.001.10"
payment_return      = "pacs.004.001.09"
recall              = "camt.056.001.08"
recall_answer       = "camt.029.001.09"
status_investigation = "pacs.028.001.03"

[currency]
allowed             = ["EUR"]
minor_units         = 2

[timing]
operating_calendar  = "always"              # 24/7/365
max_execution_seconds = 10                  # scheme time-out for the beneficiary PSP's answer
investigation_after_seconds = 25            # ours: send pacs.028 if no definitive status

[limits]
scheme_max_amount   = ""                    # no scheme cap; partner and participant limits apply
partner_max_amount  = "from-partner-agreement"

[charset]
set                 = "epc-latin"
on_violation        = "reject"

[fields]
end_to_end_id_max   = 35
remittance_unstructured_max = 140
remittance_unstructured_lines = 1
charge_bearer       = "SLEV"
account             = "iban"
agent_bic           = "optional"
uetr                = "optional"
duplicate_key       = "end-to-end-account-amount-date"

[verification_of_payee]
required            = true
interface           = "partner-vop"
mismatch_behaviour  = "show-and-require-confirmation"

[address]
mode                = "structured-or-hybrid-when-provided"

[returns]
return_window_business_days = 3
recall_window_business_days = 10
