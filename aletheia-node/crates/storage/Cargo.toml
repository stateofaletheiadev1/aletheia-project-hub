[package]
name = "aletheia-storage"
description = "KvStore abstraction and backends, consensus WAL, block archive and data-directory manifest."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aletheia-core.workspace = true
crc32c = "0.6"
zstd = { version = "0.13", default-features = false }
# Production backend (spec 5.1, 42.2). Behind a feature so tooling and quick test runs need no
# C++ toolchain; aletheiad and CI build with it.
rocksdb = { version = "0.24", default-features = false, features = ["lz4", "zstd"], optional = true }

[features]
rocksdb = ["dep:rocksdb"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
