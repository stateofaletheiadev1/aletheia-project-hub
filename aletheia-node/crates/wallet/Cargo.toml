[package]
name = "aletheia-wallet"
description = "The wallet: SLIP-0010 Ed25519 keys, encrypted keystore, payment URIs and the simulate-confirm-sign-submit-track flow."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aletheia-core.workspace = true
aletheia-crypto.workspace = true
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hmac = "0.12"
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "time"] }
zeroize.workspace = true

[dev-dependencies]
aletheia-execution.workspace = true
aletheia-monetary.workspace = true
aletheia-rpc.workspace = true
aletheia-test-harness.workspace = true
proptest.workspace = true
tokio = { version = "1", features = ["rt", "macros", "sync"] }

[lints]
workspace = true
