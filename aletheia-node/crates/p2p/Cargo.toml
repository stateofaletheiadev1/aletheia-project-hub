[package]
name = "aletheia-p2p"
description = "P2P transport: framing, TLS 1.3 mutual authentication, signed handshake, peer controls (APS-0029)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aletheia-core.workspace = true
aletheia-crypto.workspace = true
# TLS 1.3 with the ring provider (no aws-lc: it needs CMake/NASM on every build host).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }

[dev-dependencies]
proptest.workspace = true
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
