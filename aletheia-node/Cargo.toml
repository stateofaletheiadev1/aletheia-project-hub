[workspace]
resolver = "2"
# Members are added as each crate is implemented (spec Section 62 phase order). Listing a
# crate here before it exists would break `cargo build --locked`.
exclude = ["fuzz"]
members = [
  "crates/arno",
  "crates/core",
  "crates/crypto",
  "crates/consensus",
  "crates/signer",
  "crates/event-stream",
  "crates/execution",
  "crates/gateway",
  "crates/executor",
  "crates/p2p",
  "crates/storage",
  "crates/state",
  "crates/vm",
  "crates/wallet",
  "crates/monetary",
  "crates/rails",
  "crates/rpc",
  "crates/rails-model",
  "crates/node",
  "apps/aletheia-cli",
  "apps/aletheiad",
  "apps/arno",
  "apps/arno-exec",
  "apps/devnet-traffic",
  "tests/conformance",
  "tests/harness",
  "tests/paynet-reference",
  "tests/railsim",
  "tests/determinism",
  "tests/sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.91.1"
repository = "https://gitlab.com/emeka.iwuagwu/aletheia-project-hub"
publish = false

[workspace.dependencies]
aletheia-arno = { path = "crates/arno" }
aletheia-core = { path = "crates/core" }
aletheia-crypto = { path = "crates/crypto" }
aletheia-consensus = { path = "crates/consensus" }
aletheia-signer = { path = "crates/signer" }
aletheia-execution = { path = "crates/execution" }
aletheia-executor = { path = "crates/executor" }
aletheia-storage = { path = "crates/storage" }
aletheia-state = { path = "crates/state" }
aletheia-vm = { path = "crates/vm" }
aletheia-wallet = { path = "crates/wallet" }
aletheia-monetary = { path = "crates/monetary" }
aletheia-p2p = { path = "crates/p2p" }
aletheia-gateway = { path = "crates/gateway" }
aletheia-event-stream = { path = "crates/event-stream" }
aletheia-rails = { path = "crates/rails" }
aletheia-rpc = { path = "crates/rpc" }
aletheia-rails-model = { path = "crates/rails-model" }
aletheia-node = { path = "crates/node" }
aletheia-test-harness = { path = "tests/harness" }

blake3 = { version = "1.8", default-features = false }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
blst = { version = "0.3", default-features = false }
zeroize = { version = "1.8", features = ["derive"] }
getrandom = "0.3"

proptest = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "ws"] }
quick-xml = { version = "0.38", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# Spec Section 5.2: no panics, unwraps, unchecked indexing or floats on consensus paths.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
float_arithmetic = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Line tables only: backtraces keep file and line, and build output stays a fraction of the
# size (full debug info took the debug target directory past 30 GB with RocksDB).
[profile.dev]
overflow-checks = true
debug = "line-tables-only"

[profile.test]
overflow-checks = true
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[profile.hardened-release]
inherits = "release"
overflow-checks = true

[profile.coverage]
inherits = "test"

# Cryptographic dependencies are optimized even in dev and test builds: the DSP simulator runs
# real BLS for thousands of rounds, and unoptimized pairings make it ~20x slower. Results are
# identical; only speed changes.
[profile.dev.package.blst]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
