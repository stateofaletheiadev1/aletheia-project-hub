# CI for the monorepo. Node jobs run only when aletheia-node/ changes (spec Section 50).
# The toolchain comes from aletheia-node/rust-toolchain.toml; the image only supplies rustup
# and a C compiler for blst.

stages:
  - check

.node:
  image: rust:1.91.1-bookworm
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
    CARGO_TERM_COLOR: always
  before_script:
    # clang/libclang: RocksDB's Rust binding generates its FFI bindings at build time.
    - apt-get update -qq && apt-get install -y -qq clang libclang-dev > /dev/null
    - cd aletheia-node
    - rustup show active-toolchain
  cache:
    key: aletheia-node-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo-home/registry
      - aletheia-node/target
  rules:
    - changes:
        - aletheia-node/**/*
        - .gitlab-ci.yml

node:fmt:
  extends: .node
  stage: check
  script:
    - cargo fmt --check

node:clippy:
  extends: .node
  stage: check
  script:
    - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

node:test:
  extends: .node
  stage: check
  script:
    - cargo test --workspace --all-features --locked
    - cargo test --workspace --all-features --release --locked

node:lint:
  extends: .node
  stage: check
  script:
    - ./scripts/lint.sh

# Coverage-guided fuzzing on nightly (spec Section 62, Phase 1 exit: 24 h clean per target).
# Runs from a pipeline schedule or by hand; FUZZ_SECONDS sets the per-target budget.
node:fuzz:
  image: rustlang/rust:nightly-bookworm
  stage: check
  timeout: 26h
  variables:
    FUZZ_SECONDS: "3600"
  before_script:
    - cd aletheia-node/fuzz
    - cargo install cargo-fuzz --locked
  script:
    - for target in $(cargo +nightly fuzz list); do
        cargo +nightly fuzz run "$target" -- -max_total_time="$FUZZ_SECONDS" || exit 1;
      done
  artifacts:
    when: on_failure
    paths:
      - aletheia-node/fuzz/artifacts/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
