# CI for the monorepo. Node jobs run only when aletheia-node/ changes (spec Section 50);
# gov jobs only when aletheia-gov/ changes (see the bottom of this file).
# The toolchain comes from aletheia-node/rust-toolchain.toml; the image only supplies rustup
# and a C compiler for blst.

stages:
  - check

.node:
  image: rust:1.91.1-bookworm
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
    CARGO_TERM_COLOR: always
  before_script:
    # clang/libclang: RocksDB's Rust binding generates its FFI bindings at build time.
    - apt-get update -qq && apt-get install -y -qq clang libclang-dev > /dev/null
    - cd aletheia-node
    - rustup show active-toolchain
  cache:
    key: aletheia-node-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo-home/registry
      - aletheia-node/target
  rules:
    - changes:
        - aletheia-node/**/*
        - .gitlab-ci.yml

node:fmt:
  extends: .node
  stage: check
  script:
    - cargo fmt --check

node:clippy:
  extends: .node
  stage: check
  script:
    - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

node:test:
  extends: .node
  stage: check
  script:
    - cargo test --workspace --all-features --locked
    - cargo test --workspace --all-features --release --locked

node:lint:
  extends: .node
  stage: check
  script:
    - ./scripts/lint.sh

# Coverage-guided fuzzing on nightly (spec Section 62, Phase 1 exit: 24 h clean per target).
# Runs from a pipeline schedule or by hand; FUZZ_SECONDS sets the per-target budget.
node:fuzz:
  image: rustlang/rust:nightly-bookworm
  stage: check
  timeout: 26h
  variables:
    FUZZ_SECONDS: "3600"
  before_script:
    - cd aletheia-node/fuzz
    - cargo install cargo-fuzz --locked
  script:
    - for target in $(cargo +nightly fuzz list); do
        cargo +nightly fuzz run "$target" -- -max_total_time="$FUZZ_SECONDS" || exit 1;
      done
  artifacts:
    when: on_failure
    paths:
      - aletheia-node/fuzz/artifacts/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# Phase 9 exit: the Arno VM fuzzed for 7 days clean (spec Section 62). Runs the VM-facing
# targets in parallel for FUZZ_SECONDS each on a schedule with FUZZ_CAMPAIGN=vm; needs a
# runner whose job timeout allows a week.
node:fuzz-vm:
  image: rustlang/rust:nightly-bookworm
  stage: check
  timeout: 170h
  variables:
    FUZZ_SECONDS: "604800"
  before_script:
    - cd aletheia-node/fuzz
    - cargo install cargo-fuzz --locked
  script:
    - for target in vm_run arnobc_verify arno_compile; do
        cargo +nightly fuzz run "$target" -- -max_total_time="$FUZZ_SECONDS" > "$target.log" 2>&1 &
      done;
      wait -n && wait -n && wait -n
  artifacts:
    when: always
    paths:
      - aletheia-node/fuzz/artifacts/
      - aletheia-node/fuzz/*.log
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $FUZZ_CAMPAIGN == "vm"

# DSP Byzantine suite over many seeds (spec Section 62, Phase 5 exit: 10k seeds green).
node:sim:
  extends: .node
  stage: check
  timeout: 12h
  variables:
    ALETHEIA_SIM_SEEDS: "10000"
  script:
    - cargo test --release --locked -p aletheia-sim --test byzantine
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# ---------------------------------------------------------------------------
# aletheia-gov (aletheiagov.org). Quality gates of its brief, section 20.
# The Playwright image ships Node and the browsers the e2e suites need.
# ---------------------------------------------------------------------------
.gov:
  image: mcr.microsoft.com/playwright:v1.64.0-noble
  stage: check
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  before_script:
    - cd aletheia-gov
    - npm ci --no-audit --no-fund
  cache:
    key:
      files: [aletheia-gov/package-lock.json]
    paths: [.npm]
  rules:
    - changes:
        - aletheia-gov/**/*
        - .gitlab-ci.yml

gov:check:
  extends: .gov
  script:
    - npm run typecheck
    - npm run lint
    - npm test
    - npm audit --omit=dev --audit-level=high
    - npm run build
    - npm run check:public-env

gov:e2e:
  extends: .gov
  script:
    - npm run build
    # Visual baselines are per platform; Linux ones run in gov:visual once committed.
    - npx playwright test --grep-invert "visual:"
  artifacts:
    when: on_failure
    paths: [aletheia-gov/test-results/]

gov:visual:
  extends: .gov
  script:
    - npm run build
    - npx playwright test visual
  artifacts:
    when: on_failure
    paths: [aletheia-gov/test-results/]
  rules:
    - exists: [aletheia-gov/tests/visual/**/*-linux.png]
      changes: [aletheia-gov/**/*, .gitlab-ci.yml]

# Run by hand to produce the Linux visual baselines; commit them from the artifact.
gov:visual-baseline:
  extends: .gov
  script:
    - npm run build
    - npx playwright test visual --update-snapshots
  artifacts:
    paths: [aletheia-gov/tests/visual/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

gov:lighthouse:
  extends: .gov
  variables:
    APP_ENV: production
  script:
    - npm run build
    - (node scripts/start.mjs 3200 > server.log 2>&1 &)
    - for i in $(seq 30); do node -e "fetch('http://127.0.0.1:3200/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && break; sleep 2; done
    - export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
    - node scripts/lighthouse.mjs http://127.0.0.1:3200
  artifacts:
    when: always
    paths: [aletheia-gov/test-results/lighthouse.json]

gov:secrets:
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.28.0
    entrypoint: [""]
  stage: check
  script:
    - gitleaks dir aletheia-gov --redact --verbose
  rules:
    - changes:
        - aletheia-gov/**/*
        - .gitlab-ci.yml
