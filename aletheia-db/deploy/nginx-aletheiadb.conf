# AletheiaDB public endpoint: db.stateofaletheia.org (separate from the Kortana site).
server {
    listen      80;
    listen      [::]:80;
    server_name db.stateofaletheia.org;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://db.stateofaletheia.org$request_uri;
    }
}

limit_req_zone $binary_remote_addr zone=adb:10m rate=30r/s;

upstream aletheiadb {
    server 127.0.0.1:7790;
    keepalive 16;
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name db.stateofaletheia.org;

    ssl_certificate     /etc/letsencrypt/live/db.stateofaletheia.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db.stateofaletheia.org/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSLADB:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Cache-Control             "no-store" always;

    access_log /var/log/nginx/aletheiadb.access.log;
    error_log  /var/log/nginx/aletheiadb.error.log;
    client_max_body_size 1m;

    # Until AletheiaDB is running, answer honestly in JSON instead of a gateway error page.
    error_page 502 503 504 = @aletheiadb_unavailable;
    location @aletheiadb_unavailable {
        default_type application/json;
        return 503 '{"error":"unavailable","message":"AletheiaDB is not running yet."}\n';
    }

    location / {
        limit_req zone=adb burst=60 nodelay;
        proxy_pass         http://aletheiadb;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering       off;
    }
}
