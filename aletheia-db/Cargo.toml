[package]
name = "aletheiadb"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "AletheiaDB: the document database of the Sovereign Covenant State of Aletheia"
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "aletheiadb"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
base64 = "0.23.1"
getrandom = "0.4.3"
redb = "4.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["limit", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
