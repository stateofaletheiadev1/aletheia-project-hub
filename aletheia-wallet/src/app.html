<!doctype html>
<html lang="en" data-theme-pending>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF8F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1628" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="preload" href="%sveltekit.assets%/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Sets data-theme and data-motion before first paint (no flash). Same-origin file, so the CSP needs no exception. -->
    <script src="%sveltekit.assets%/theme-boot.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
