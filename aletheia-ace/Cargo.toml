[package]
name = "aletheia-compute-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
description = "ACE: builds, launches, supervises and recovers the Aletheia StableChain node"
license = "Apache-2.0"
publish = false

[lib]
name = "ace"
path = "src/lib.rs"

[[bin]]
name = "ace"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
nix = { version = "0.29", features = ["signal", "fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
signal-hook = "0.3"
serde_json = "1.0"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
thiserror = "2.0"
toml = "0.9"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
