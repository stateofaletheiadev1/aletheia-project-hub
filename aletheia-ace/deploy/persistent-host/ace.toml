# ACE on a long-lived Linux host with a durable disk (install as /etc/ace/ace.toml).
# Absolute paths throughout. The network is still a devnet: aletheiad refuses plaintext keys
# on every other network until the signer daemon exists (docs/KNOWN_LIMITATIONS.md).
config_version = 1

[source]
repository = "https://gitlab.com/emeka.iwuagwu/aletheia-project-hub.git"
commit = "1b4f4dc409255e730b566b434c7fd955742cbc7c"
reference = "main"
workspace = "aletheia-node"
checkout_dir = "/var/lib/ace/src"

[build]
profile = "release"
packages = ["aletheiad", "aletheia-arno-exec", "aletheia-cli"]
features = ["aletheiad/devnet-producer"]
binaries = ["aletheiad", "aletheia-arno-exec", "aletheia-cli"]
target_dir = "/var/lib/ace/target"
output_dir = "/var/lib/ace/bin"
max_duration_s = 5400

[node]
config = "/etc/ace/node.toml"
working_dir = "/var/lib/aletheia"
role = "devnet-producer"
expected_network = "devnet"
expected_chain_id = 7771
expected_genesis_id = "9164487f5f211839f5796c6b2193e17d289a285d9eebce6bbc592f26a4c7719e"

[runtime]
state_dir = "/var/lib/ace/run"

[limits]
# Stop the node cleanly long before RocksDB meets a full disk.
min_free_disk_mb = 4096
min_memory_mb = 1024
max_snapshot_mb = 8192

[persistence]
# Declared by the operator: ACE checks that this is not a CI runner and not tmpfs, and
# reports the class as PersistentDeclared, never as measured.
mode = "persistent-host"
checkpoint_dir = "/var/lib/ace/checkpoints"

# [tunnel]
# provider = "cloudflared"
# public_url = "https://rpc.stateofaletheia.org"
